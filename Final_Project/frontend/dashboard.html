<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasik – Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      background: #0f0c29;
      overflow-x: hidden;
    }

    /* ── Gradient Background ── */
    .bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      z-index: 0;
    }

    /* ── Floating Bubbles ── */
    .bubbles {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.3;
      animation: float linear infinite;
    }

    .bubble:nth-child(1) { width: 500px; height: 500px; background: #7c3aed; left: -150px; top: -150px; animation-duration: 18s; }
    .bubble:nth-child(2) { width: 350px; height: 350px; background: #06b6d4; right: -100px; top: 15%;   animation-duration: 22s; animation-delay: -4s; }
    .bubble:nth-child(3) { width: 300px; height: 300px; background: #ec4899; left: 35%;    top: 55%;   animation-duration: 16s; animation-delay: -8s; }
    .bubble:nth-child(4) { width: 250px; height: 250px; background: #f59e0b; right: 15%;   bottom: 5%; animation-duration: 20s; animation-delay: -2s; }
    .bubble:nth-child(5) { width: 200px; height: 200px; background: #10b981; left: 8%;     bottom: 18%;animation-duration: 14s; animation-delay: -6s; }
    .bubble:nth-child(6) { width: 220px; height: 220px; background: #6366f1; left: 55%;    top: 8%;    animation-duration: 25s; animation-delay: -10s; }

    @keyframes float {
      0%   { transform: translateY(0px) scale(1); }
      33%  { transform: translateY(-40px) scale(1.05); }
      66%  { transform: translateY(20px) scale(0.95); }
      100% { transform: translateY(0px) scale(1); }
    }

    /* ── OVAL NAVBAR ── */
    .nav-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: calc(100% - 32px);
      max-width: 900px;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-radius: 999px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      gap: 12px;
    }

    /* Logo */
    .nav-logo {
      font-size: 16px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
      letter-spacing: -0.5px;
    }

    /* Stats pills inside navbar */
    .nav-stats {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav-stat {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav-stat.total    { background: rgba(255,255,255,0.1); color: #e2e8f0; }
    .nav-stat.active   { background: rgba(16,185,129,0.2);  color: #6ee7b7; }
    .nav-stat.inactive { background: rgba(239,68,68,0.2);   color: #fca5a5; }

    /* User info */
    .nav-user {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
    }

    .nav-name {
      font-size: 12px;
      font-weight: 700;
      color: #e2e8f0;
    }

    .logout-btn {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      padding: 5px 12px;
      border-radius: 999px;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .logout-btn:hover {
      background: rgba(239,68,68,0.3);
      color: #fff;
    }

    /* ── Page Content ── */
    .page {
      position: relative;
      z-index: 10;
      max-width: 900px;
      margin: 0 auto;
      padding: 100px 16px 40px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 16px;
      align-items: start;
    }

    /* ── Glass Card ── */
    .glass {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    /* ── Add Task Card ── */
    .add-card {
      padding: 22px;
      position: sticky;
      top: 90px;
    }

    .add-card h2 {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .input-group { margin-bottom: 12px; }

    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: rgba(255,255,255,0.4);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      color: #fff;
      transition: all 0.2s;
    }

    input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.2); }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #a78bfa;
      background: rgba(255,255,255,0.1);
    }

    select option { background: #302b63; color: #fff; }

    textarea { resize: vertical; height: 80px; }

    .add-btn {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.2s;
    }

    .add-btn:hover   { opacity: 0.85; }
    .add-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Tasks Panel ── */
    .tasks-panel {}

    .tasks-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .tasks-header h2 { font-size: 14px; font-weight: 700; color: #fff; }

    .badge {
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
    }

    /* Filters */
    .filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }

    .filter-btn {
      padding: 5px 14px;
      border-radius: 999px;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.5);
    }

    .filter-btn.active {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border-color: rgba(255,255,255,0.25);
    }

    /* ── Task Card ── */
    .task-card {
      padding: 16px 18px;
      border-radius: 14px;
      margin-bottom: 10px;
      border-left: 3px solid #a78bfa;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .task-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.3);
    }

    .task-card.inactive { border-left-color: rgba(255,255,255,0.15); }

    .task-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 6px;
    }

    .task-title { font-size: 13px; font-weight: 700; color: #fff; }

    .task-category {
      font-size: 10px;
      background: rgba(167,139,250,0.2);
      color: #c4b5fd;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
      white-space: nowrap;
    }

    .task-desc { font-size: 12px; color: rgba(255,255,255,0.45); line-height: 1.6; margin-bottom: 12px; }

    .task-bottom { display: flex; justify-content: space-between; align-items: center; }

    .task-status {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .task-status.active   { background: rgba(16,185,129,0.2);  color: #6ee7b7; }
    .task-status.inactive { background: rgba(239,68,68,0.2);   color: #fca5a5; }

    .task-actions { display: flex; gap: 6px; }

    .task-actions button {
      padding: 5px 12px;
      border: none;
      border-radius: 6px;
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .edit-btn   { background: rgba(167,139,250,0.2); color: #c4b5fd; }
    .delete-btn { background: rgba(239,68,68,0.2);   color: #fca5a5; }
    .edit-btn:hover   { background: #7c3aed; color: #fff; }
    .delete-btn:hover { background: #ef4444; color: #fff; }

    /* ── Empty State ── */
    .empty {
      text-align: center;
      padding: 50px 20px;
      color: rgba(255,255,255,0.3);
    }

    .empty p { font-size: 13px; margin-top: 8px; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      z-index: 999;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      pointer-events: none;
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.15);
    }

    .toast.show  { opacity: 1; transform: translateY(0); }
    .toast.success { background: rgba(16,185,129,0.25); color: #6ee7b7; }
    .toast.error   { background: rgba(239,68,68,0.25);  color: #fca5a5; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border-radius: 20px;
      backdrop-filter: blur(24px);
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .modal h2 {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .modal-btns { display: flex; gap: 10px; margin-top: 16px; }

    .modal-btns button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .save-btn   { background: linear-gradient(135deg, #7c3aed, #06b6d4); color: #fff; }
    .cancel-btn { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); }
    .save-btn:hover   { opacity: 0.85; }
    .cancel-btn:hover { background: rgba(255,255,255,0.15); }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .page { grid-template-columns: 1fr; padding-top: 90px; }
      .add-card { position: static; }
      .nav-stats { display: none; }
      .nav-name  { display: none; }
    }

    @media (max-width: 400px) {
      .nav-wrap { width: calc(100% - 16px); top: 8px; }
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="bubbles">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
  </div>

  <!-- Oval Blur Navbar -->
  <div class="nav-wrap">
    <nav>
      <div class="nav-logo">TASIK</div>

      <div class="nav-stats">
        <div class="nav-stat total">📋 <span id="stat-total">0</span> Total</div>
        <div class="nav-stat active">✅ <span id="stat-active">0</span> Active</div>
        <div class="nav-stat inactive">⏸ <span id="stat-inactive">0</span> Inactive</div>
      </div>

      <div class="nav-user">
        <div class="avatar" id="avatar">M</div>
        <span class="nav-name" id="user-name">User</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </nav>
  </div>

  <!-- Page Content -->
  <div class="page">

    <!-- Add Task -->
    <div class="add-card glass">
      <h2>✦ Add New Task</h2>
      <div class="input-group">
        <label>Title</label>
        <input type="text" id="task-title" placeholder="Task title">
      </div>
      <div class="input-group">
        <label>Description</label>
        <textarea id="task-desc" placeholder="Describe the task..."></textarea>
      </div>
      <div class="input-group">
        <label>Category</label>
        <input type="text" id="task-category" placeholder="e.g. Work, Personal">
      </div>
      <button class="add-btn" id="add-btn" onclick="addTask()">+ Add Task</button>
    </div>

    <!-- Tasks -->
    <div class="tasks-panel">
      <div class="tasks-header">
        <h2>My Tasks</h2>
        <span class="badge" id="task-count">0</span>
      </div>

      <div class="filters">
        <button class="filter-btn active" onclick="filterTasks('all', this)">All</button>
        <button class="filter-btn" onclick="filterTasks('active', this)">Active</button>
        <button class="filter-btn" onclick="filterTasks('inactive', this)">Inactive</button>
      </div>

      <div id="task-list"></div>
    </div>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2>✏️ Edit Task</h2>
      <div class="input-group">
        <label>Title</label>
        <input type="text" id="edit-title">
      </div>
      <div class="input-group">
        <label>Description</label>
        <textarea id="edit-desc"></textarea>
      </div>
      <div class="input-group">
        <label>Category</label>
        <input type="text" id="edit-category">
      </div>
      <div class="input-group">
        <label>Status</label>
        <select id="edit-status">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
      <div class="modal-btns">
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        <button class="save-btn"   onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    const API = 'https://tasik-api.onrender.com';
    let editingId  = null;
    let allTasks   = [];
    let filterMode = 'all';

    const token = localStorage.getItem('token');
    const user  = JSON.parse(localStorage.getItem('user') || '{}');

    if (!token) window.location.href = 'index.html';

    const name = user.name || 'User';
    document.getElementById('user-name').textContent = name;
    document.getElementById('avatar').textContent    = name.charAt(0).toUpperCase();

    const headers = {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    };

    function showToast(text, type) {
      const t = document.getElementById('toast');
      t.textContent = text;
      t.className   = `toast ${type} show`;
      setTimeout(() => { t.className = 'toast'; }, 3000);
    }

    function handleUnauthorized() {
      showToast('Session expired. Please login again.', 'error');
      setTimeout(logout, 1500);
    }

    async function verifySession() {
      const res = await fetch(`${API}/api/auth/me`, { headers });
      if (res.status === 401) handleUnauthorized();
    }

    function updateStats(tasks) {
      document.getElementById('stat-total').textContent    = tasks.length;
      document.getElementById('stat-active').textContent   = tasks.filter(t => t.status === 'active').length;
      document.getElementById('stat-inactive').textContent = tasks.filter(t => t.status === 'inactive').length;
    }

    function renderTasks() {
      const filtered = filterMode === 'all' ? allTasks : allTasks.filter(t => t.status === filterMode);
      const list = document.getElementById('task-list');
      document.getElementById('task-count').textContent = filtered.length;

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty"><div style="font-size:36px;">📭</div><p>${filterMode === 'all' ? 'No tasks yet. Add your first task!' : `No ${filterMode} tasks.`}</p></div>`;
        return;
      }

      list.innerHTML = filtered.map(task => `
        <div class="task-card glass ${task.status}">
          <div class="task-top">
            <p class="task-title">${task.title}</p>
            <span class="task-category">${task.category || 'General'}</span>
          </div>
          <p class="task-desc">${task.description}</p>
          <div class="task-bottom">
            <span class="task-status ${task.status}">${task.status}</span>
            <div class="task-actions">
              <button class="edit-btn"   onclick="openEdit('${task._id}','${task.title}','${task.description}','${task.category || ''}','${task.status}')">Edit</button>
              <button class="delete-btn" onclick="deleteTask('${task._id}')">Delete</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterTasks(mode, btn) {
      filterMode = mode;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTasks();
    }

    async function loadTasks() {
      try {
        const res = await fetch(`${API}/api/data`, { headers });
        if (res.status === 401) { handleUnauthorized(); return; }
        allTasks = await res.json();
        updateStats(allTasks);
        renderTasks();
      } catch { showToast('Failed to load tasks.', 'error'); }
    }

    async function addTask() {
      const title       = document.getElementById('task-title').value.trim();
      const description = document.getElementById('task-desc').value.trim();
      const category    = document.getElementById('task-category').value.trim();

      if (!title || !description) { showToast('Title and description are required.', 'error'); return; }

      const btn = document.getElementById('add-btn');
      btn.disabled = true; btn.textContent = 'Adding...';

      try {
        const res = await fetch(`${API}/api/data`, { method: 'POST', headers, body: JSON.stringify({ title, description, category }) });
        if (res.status === 401) { handleUnauthorized(); return; }
        if (res.ok) {
          document.getElementById('task-title').value    = '';
          document.getElementById('task-desc').value     = '';
          document.getElementById('task-category').value = '';
          showToast('✓ Task added!', 'success');
          loadTasks();
        }
      } catch { showToast('Server error.', 'error'); }
      finally { btn.disabled = false; btn.textContent = '+ Add Task'; }
    }

    function openEdit(id, title, desc, category, status) {
      editingId = id;
      document.getElementById('edit-title').value    = title;
      document.getElementById('edit-desc').value     = desc;
      document.getElementById('edit-category').value = category;
      document.getElementById('edit-status').value   = status;
      document.getElementById('modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
      editingId = null;
    }

    async function saveEdit() {
      try {
        const res = await fetch(`${API}/api/data/${editingId}`, {
          method: 'PUT', headers,
          body: JSON.stringify({
            title:       document.getElementById('edit-title').value.trim(),
            description: document.getElementById('edit-desc').value.trim(),
            category:    document.getElementById('edit-category').value.trim(),
            status:      document.getElementById('edit-status').value
          })
        });
        if (res.status === 401) { handleUnauthorized(); return; }
        if (res.ok) { showToast('✓ Task updated!', 'success'); closeModal(); loadTasks(); }
      } catch { showToast('Server error.', 'error'); }
    }

    async function deleteTask(id) {
      if (!confirm('Delete this task?')) return;
      try {
        const res = await fetch(`${API}/api/data/${id}`, { method: 'DELETE', headers });
        if (res.status === 401) { handleUnauthorized(); return; }
        if (res.ok) { showToast('✓ Task deleted!', 'success'); loadTasks(); }
      } catch { showToast('Server error.', 'error'); }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    }

    verifySession();
    loadTasks();
  </script>

</body>
</html>
